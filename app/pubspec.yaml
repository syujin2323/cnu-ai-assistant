name: cnu_ai_assistant
description: "충남대 학부생용 일정 비서 앱"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.8

dependencies:
  cupertino_ui: ^1.1.4
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_app_check: ^0.5.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  go_router: ^18.1.1
  intl: ^0.20.3
  material_ui: ^1.8.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  json_schema: ^5.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/OFL.txt

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
