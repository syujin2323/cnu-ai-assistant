name: pr-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR 제목과 대상 브랜치 검사
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE" != "develop" && "$BASE" != "main" ]]; then
            echo "::error::PR은 develop(작업 브랜치)이나 main(develop에서 오는 release)으로만 보냅니다. PR 제목 옆 Edit에서 대상 브랜치(base)를 고치세요."
            exit 1
          fi
          if [[ "$BASE" == "main" && ("$HEAD" != "develop" || "$HEAD_REPO" != "$REPO") ]]; then
            echo "::error::main으로는 이 레포의 develop에서 오는 PR만 보낼 수 있습니다. PR 제목 옆 Edit에서 대상 브랜치(base)를 develop으로 바꾸세요."
            exit 1
          fi
          # 종류를 바꾸면 CLAUDE.md와 docs/guide.md의 표도 같이 고친다. 설명은 공백으로 시작하지 않고 마침표로 끝나지 않는다.
          tail='[^[:space:]](.*[^.[:space:]])?$'
          if [[ "$BASE" == "main" ]]; then
            pattern="^release: $tail"
            example='release: 중간 발표 버전'
          else
            pattern="^(feat|fix|docs|refactor|test|chore): $tail"
            example='feat: 로그인 화면 추가'
          fi
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR 제목은 '${example}'처럼 '종류: 설명' 형식이고 끝에 마침표가 없어야 합니다. 제목을 고치면 검사가 다시 돌아갑니다. 종류 목록은 CLAUDE.md를 보세요."
            exit 1
          fi

  leak-check:
    name: leak-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 검사 패턴과 순서는 .github/scripts/leak-check.sh에 있다. 패턴을 고치면 그 파일의 자체 시험 샘플도 함께 고친다.
      - name: 검사 스크립트 자체 시험
        run: bash .github/scripts/leak-check.sh --self-test
      # LMS 쿠키 이름은 이 파일과 스크립트에 적지 않는다. 레포 Settings → Secrets and variables → Actions → Secrets에
      # LMS_COOKIE_NAMES를 '이름1|이름2' 형식으로 둔다(변수는 로그에 그대로 찍히므로 쓰지 않는다).
      # 이 레포의 PR에서 비어 있거나 형식이 틀리면 실패하고, 비밀값을 받지 못하는 포크 PR에서는 경고만 낸다.
      # PR 제목·본문은 run에 끼우지 않고 env로 넘긴다.
      - name: 커밋별 추가 줄, PR 제목·본문, 커밋 메시지 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LMS_COOKIE_NAMES: ${{ secrets.LMS_COOKIE_NAMES }}
        run: bash .github/scripts/leak-check.sh
