name: functions-check

# functions/(Cloud Functions 서버)를 바꾼 PR과 develop push에서 서버 코드의 린트(타입 검사·ESLint·Prettier)와
# 테스트를 돌린다. 필수 검사가 아니므로 경로 필터를 워크플로에 둔다(docs/architecture.md '확인과 CI').
# 명령을 바꾸면 레포 루트 Makefile의 functions-check도 같은 PR에서 고친다.
on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"
  push:
    branches: [develop]
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"

permissions: {}

jobs:
  functions-check:
    name: functions-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 버전은 functions/package.json의 engines.node를 읽는다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # 커밋한 package-lock.json 그대로 받는다. package.json과 맞지 않으면 실패한다.
      - name: 패키지 받기
        run: |
          if ! npm ci; then
            echo "::error::package-lock.json이 package.json과 맞지 않습니다. functions/에서 npm install을 돌려 바뀐 package-lock.json을 함께 커밋하세요."
            exit 1
          fi

      - name: 린트
        run: |
          if ! npm run lint; then
            echo "::error::타입 검사·ESLint·Prettier 가운데 하나가 실패했습니다. 레포 루트에서 make functions-check로 재현하고, 포맷이면 make functions-format으로 맞춘 뒤 커밋하세요."
            exit 1
          fi

      - name: 테스트
        run: |
          if ! npm test; then
            echo "::error::functions 테스트가 실패했습니다. 위 로그에서 실패한 테스트를 확인하고 functions/에서 npm test로 다시 돌려 보세요."
            exit 1
          fi
