name: app-check

# develop 필수 검사라 모든 PR(develop → main release PR 포함)과 develop push에서 돈다. 경로 필터를 워크플로에 두면
# 앱을 바꾸지 않은 PR에서 검사가 생기지 않아 필수로 둘 수 없으므로, 첫 단계에서 바뀐 경로를 보고 앱과 관계없는 변경이면
# 뒤 단계를 건너뛰고 성공으로 끝낸다(docs/decisions.md 2026-11-14 'app-check·pr-rules·leak-check를 develop 필수 검사로 둔다').
on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

jobs:
  app-check:
    name: app-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # app/·schema/·이 워크플로·Makefile, 그리고 docs/architecture.md(디자인 토큰·모션 표를 테스트가 읽음)가 바뀌었을
      # 때만 뒤 단계를 돌린다. 비교할 커밋을 찾지 못하면(새 브랜치의 첫 push 등) 모두 돌린다.
      - name: 바뀐 경로 보기
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [[ "$EVENT" == "push" ]]; then base="$PUSH_BEFORE"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(app/|schema/|\.github/workflows/app-check\.yml$|Makefile$|docs/architecture\.md$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "앱과 관계없는 변경이라 검사를 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Flutter 버전은 app/pubspec.yaml의 environment.flutter(정확한 버전)를 읽는다.
      # 이 잡은 비밀값을 파일로 쓰므로 서드파티 액션은 태그 대신 릴리스 커밋 SHA로 고정한다.
      # 올릴 때는 새 릴리스 태그의 커밋 SHA와 버전 주석을 함께 바꾼다.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      # firebase_options.dart는 커밋하지 않는다. 레포 Settings → Secrets and variables → Actions → Secrets의
      # FIREBASE_OPTIONS_DART에 app/lib/firebase_options.dart 내용 전체를 넣어 둔다. 포맷은 패키지를 받은 뒤 CI가 맞춘다.
      # 값이 로그에 남지 않도록 출력하지 않고 파일로만 쓴다. google-services.json·GoogleService-Info.plist는 CI에 두지 않는다.
      - name: Firebase 설정 파일 만들기
        if: steps.changes.outputs.run == 'true'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [[ -z "$FIREBASE_OPTIONS_DART" ]]; then
            echo "::error::Actions 비밀값 FIREBASE_OPTIONS_DART가 비어 있습니다. 레포 Settings → Secrets and variables → Actions → Secrets에 팀 비공개 채널의 app/lib/firebase_options.dart 내용 전체를 FIREBASE_OPTIONS_DART로 넣은 뒤 검사를 다시 돌리세요. 포크에서 온 PR에는 비밀값이 전달되지 않습니다."
            exit 1
          fi
          # 웹에서 붙여 넣으며 생긴 CR과 끝의 빈 줄을 정리해 줄바꿈 하나로 끝나게 쓴다.
          content="$(printf '%s' "$FIREBASE_OPTIONS_DART" | tr -d '\r')"
          printf '%s\n' "$content" > lib/firebase_options.dart

      # 커밋한 pubspec.lock 그대로 받는다. pubspec.yaml과 맞지 않으면 버전을 새로 고르지 않고 실패한다.
      - name: 패키지 받기
        if: steps.changes.outputs.run == 'true'
        run: |
          if ! flutter pub get --enforce-lockfile; then
            echo "::error::pubspec.lock이 pubspec.yaml과 맞지 않습니다. app/에서 flutter pub get을 돌려 바뀐 pubspec.lock을 함께 커밋하세요."
            exit 1
          fi

      # 비밀값으로 만든 firebase_options.dart는 커밋하지 않는 파일이다. 비밀값 내용이 이 Dart 버전의 포맷과 달라도
      # PR 코드와 무관하게 '코드 포맷 검사'가 이 파일 때문에 실패하지 않도록 먼저 맞춘다. 패키지를 받은 뒤에 맞춰야
      # 포맷 검사와 같은 언어 버전을 쓴다. 파싱 오류 메시지에는 소스 줄이 찍히므로 공개 로그에 남지 않게 출력은 모두 버린다.
      - name: Firebase 설정 파일 포맷 맞추기
        if: steps.changes.outputs.run == 'true'
        run: |
          if ! dart format lib/firebase_options.dart > /dev/null 2>&1; then
            echo "::error::FIREBASE_OPTIONS_DART로 만든 lib/firebase_options.dart를 Dart 코드로 읽을 수 없습니다. 비밀값에 팀 비공개 채널의 app/lib/firebase_options.dart 내용 전체를 그대로 넣었는지 확인하세요."
            exit 1
          fi

      # drift 테이블·쿼리를 바꾸고 생성 파일(*.g.dart)을 다시 만들지 않으면 analyze·test는 통과해도 실제 DB 스키마
      # (생성된 CREATE TABLE)가 코드·문서와 달라진다. 생성 파일을 다시 만들어 보고 바뀌거나 새로 생긴 파일이 있으면 실패한다.
      # git diff는 커밋하지 않은 새 생성 파일을 못 보므로 전후 체크섬을 비교한다. 레포 루트의 make gen-check와 같은 검사다.
      - name: drift 생성 파일 검사
        if: steps.changes.outputs.run == 'true'
        run: |
          snapshot() { find lib -name '*.g.dart' -type f -exec cksum {} + | sort; }
          before="$(snapshot)"
          if ! dart run build_runner build -d; then
            echo "::error::build_runner가 실패했습니다. 위 로그의 오류를 고친 뒤 레포 루트에서 make gen으로 다시 만들어 보세요."
            exit 1
          fi
          if [[ "$(snapshot)" != "$before" ]]; then
            git status --short -- '*.g.dart'
            echo "::error::drift 생성 파일이 최신이 아닙니다. 레포 루트에서 make gen을 돌려 위에 나온 생성 파일을 함께 커밋하세요."
            exit 1
          fi

      # 대상은 lib test다. macOS의 flutter pub get이 build/ios/SourcePackages에 만드는 패키지 사본까지 '.'에 잡혀 로컬 검사가 늘 실패하므로 로컬과 같은 명령을 쓴다.
      - name: 코드 포맷 검사
        if: steps.changes.outputs.run == 'true'
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::error::dart format으로 맞추지 않은 Dart 파일이 있습니다. 위에 나온 파일을 app/에서 dart format으로 맞춘 뒤 커밋하세요."
            exit 1
          fi

      - name: 정적 분석
        if: steps.changes.outputs.run == 'true'
        run: |
          if ! flutter analyze; then
            echo "::error::flutter analyze가 문제를 찾았습니다. 위 목록을 고친 뒤 커밋하세요. 경고와 정보(info)도 모두 0개여야 합니다."
            exit 1
          fi

      - name: 테스트
        if: steps.changes.outputs.run == 'true'
        run: |
          if ! flutter test; then
            echo "::error::flutter test가 실패했습니다. 위 로그에서 실패한 테스트를 확인하고 app/에서 flutter test로 다시 돌려 보세요."
            exit 1
          fi
