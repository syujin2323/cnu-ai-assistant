name: app-check

# 대상 브랜치와 상관없이 app/**가 바뀐 PR에서 돈다(develop → main release PR 포함).
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-check.yml"

permissions: {}

jobs:
  app-check:
    name: app-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Flutter 버전은 app/pubspec.yaml의 environment.flutter(정확한 버전)를 읽는다.
      # 이 잡은 비밀값을 파일로 쓰므로 서드파티 액션은 태그 대신 릴리스 커밋 SHA로 고정한다.
      # 올릴 때는 새 릴리스 태그의 커밋 SHA와 버전 주석을 함께 바꾼다.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      # firebase_options.dart는 커밋하지 않는다. 레포 Settings → Secrets and variables → Actions → Secrets의
      # FIREBASE_OPTIONS_DART에 dart format을 거친 app/lib/firebase_options.dart 내용 전체를 넣어 둔다.
      # 값이 로그에 남지 않도록 출력하지 않고 파일로만 쓴다. google-services.json·GoogleService-Info.plist는 CI에 두지 않는다.
      - name: Firebase 설정 파일 만들기
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [[ -z "$FIREBASE_OPTIONS_DART" ]]; then
            echo "::error::Actions 비밀값 FIREBASE_OPTIONS_DART가 비어 있습니다. 레포 Settings → Secrets and variables → Actions → Secrets에 팀 비공개 채널의 app/lib/firebase_options.dart 내용 전체를 FIREBASE_OPTIONS_DART로 넣은 뒤 검사를 다시 돌리세요. 포크에서 온 PR에는 비밀값이 전달되지 않습니다."
            exit 1
          fi
          # 웹에서 붙여 넣으며 생긴 CR과 끝의 빈 줄을 정리해 줄바꿈 하나로 끝나게 쓴다(dart format 검사가 파일 끝을 본다).
          content="$(printf '%s' "$FIREBASE_OPTIONS_DART" | tr -d '\r')"
          printf '%s\n' "$content" > lib/firebase_options.dart

      # 커밋한 pubspec.lock 그대로 받는다. pubspec.yaml과 맞지 않으면 버전을 새로 고르지 않고 실패한다.
      - name: 패키지 받기
        run: |
          if ! flutter pub get --enforce-lockfile; then
            echo "::error::pubspec.lock이 pubspec.yaml과 맞지 않습니다. app/에서 flutter pub get을 돌려 바뀐 pubspec.lock을 함께 커밋하세요."
            exit 1
          fi

      # 대상은 lib test다. macOS의 flutter pub get이 build/ios/SourcePackages에 만드는 패키지 사본까지 '.'에 잡혀 로컬 검사가 늘 실패하므로 로컬과 같은 명령을 쓴다.
      - name: 코드 포맷 검사
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::error::dart format으로 맞추지 않은 Dart 파일이 있습니다. 위에 나온 파일을 app/에서 dart format으로 맞춘 뒤 커밋하세요."
            exit 1
          fi

      - name: 정적 분석
        run: |
          if ! flutter analyze; then
            echo "::error::flutter analyze가 문제를 찾았습니다. 위 목록을 고친 뒤 커밋하세요. 경고와 정보(info)도 모두 0개여야 합니다."
            exit 1
          fi

      - name: 테스트
        run: |
          if ! flutter test; then
            echo "::error::flutter test가 실패했습니다. 위 로그에서 실패한 테스트를 확인하고 app/에서 flutter test로 다시 돌려 보세요."
            exit 1
          fi
